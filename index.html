  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --orange: #c47f31;
      --orange-glow: #da994e;
      --cream: #ede3ce;
      --dark: #171614;
      --text-muted: #7a746a;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--dark);
      color: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Grow hero grow on tall screens */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Grain overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes logoFade {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: clamp(3rem, 8vh, 5rem) 1.5rem 4rem;
      position: relative;
      text-align: center;
      isolation: isolate;
    }

    /* Key art backdrop */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("assets/MightyTinyRailways-bg-2560x1440.jpg") center top / cover no-repeat;
      z-index: -2;
    }

    /* Fade */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          rgba(23, 22, 20, 0.35) 0%,
          rgba(23, 22, 20, 0.15) 30%,
          rgba(23, 22, 20, 0.6) 70%,
          var(--dark) 100%);
      pointer-events: none;
      z-index: -1;
    }

    .hero-logo {
      width: min(600px, 86vw);
      height: auto;
      filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.6));
      animation: logoFade 1.2s ease-out both;
    }

    .tagline {
      margin-top: -0.5rem;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--cream);
      opacity: 0.85;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
      animation: fadeUp 1s 0.4s ease-out both;
    }

    .hero-trailer {
      width: min(960px, 100%);
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(23, 22, 20, 0.55);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: fadeUp 1s 0.3s ease-out both;
    }

    .hero-trailer iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Steam store widget */
    .steam-widget {
      animation: fadeUp 1s 0.5s ease-out both;
    }

    .steam-widget iframe {
      display: block;
      border: 0;
      border-radius: 4px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    /* Wishlist button */
    .cta-row {
      display: none;
      animation: fadeUp 1s 0.5s ease-out both;
    }

    @media (max-width: 680px) {
      .steam-widget {
        display: none;
      }

      .cta-row {
        display: block;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.6rem;
      border-radius: 999px;
      background: var(--orange);
      color: var(--cream);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: transform 0.3s, background 0.3s;
    }

    .btn:hover {
      background: var(--orange-glow);
      transform: translateY(-2px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .platform-note {
      margin-top: -0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      animation: fadeUp 1s 0.9s ease-out both;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    footer a {
      color: var(--orange);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
  </style>
